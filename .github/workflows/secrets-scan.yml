name: Secrets scan (quick grep)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quick-scan:
    name: Quick secrets grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run quick grep for common secret patterns
        run: |
          set -e
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E "(BEGIN RSA PRIVATE KEY|BEGIN PRIVATE KEY|-----BEGIN PRIVATE KEY-----|AKIA[0-9A-Z]{16}|AWS_SECRET_ACCESS_KEY|GITHUB_TOKEN|github_token|PRIVATE KEY|password=)" . > secrets-scan.txt || true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan.txt
          path: secrets-scan.txt
